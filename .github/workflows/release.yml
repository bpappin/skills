name: Release

# Fully automatic. Push to master; if any skill version moved, this
# publishes. If nothing moved, it does nothing.
#
# Tags are dated - v2026.08.02, and v2026.08.02.1 for a second one the
# same day. The repo has no release planning to describe, so a semver
# number on it would claim more than it knows; the versions that mean
# something are the per-skill ones, and those the update check reads.
#
# You never tag, never pick a number, never run anything. Add lines to
# CHANGELOG.md [Unreleased] while working and they become the notes;
# skip it and the release still happens.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refresh the manifest
        run: ./scripts/skill-versions.sh skills --publish

      - name: Has anything moved?
        id: check
        run: |
          # newest dated tag. -v:refname orders v2026.08.02.2 above
          # v2026.08.02, which creatordate cannot when tags share a second.
          LAST_TAG="$(git tag --list 'v20*' --sort=-v:refname | head -1)"
          echo "last tag: ${LAST_TAG:-none}"

          : > /tmp/old.json
          [[ -n "$LAST_TAG" ]] && git show "$LAST_TAG:VERSIONS.json" > /tmp/old.json 2>/dev/null || true

          if ! ./scripts/skill-diff.sh /tmp/old.json VERSIONS.json > /tmp/why; then
            echo "release=no" >> "$GITHUB_OUTPUT"
            echo "No skill versions moved - nothing to release." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # dated tag, with a counter if today already has one
          DAY="$(date +%Y.%m.%d)"; V="$DAY"; n=1
          while git rev-parse -q --verify "refs/tags/v$V" >/dev/null; do
            V="$DAY.$n"; n=$((n + 1))
          done

          echo "release=yes"   >> "$GITHUB_OUTPUT"
          echo "version=$V"    >> "$GITHUB_OUTPUT"
          echo "tag=v$V"       >> "$GITHUB_OUTPUT"
          { echo "### Releasing v$V"; echo; echo '```'; cat /tmp/why; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Roll the changelog
        if: steps.check.outputs.release == 'yes'
        env:
          V: ${{ steps.check.outputs.version }}
        run: |
          if ! grep -q "^## \[$V\]" CHANGELOG.md \
             && ./scripts/changelog-section.sh Unreleased >/dev/null 2>&1; then
            python3 - "$V" <<'PY'
          import sys
          ver = sys.argv[1]
          s = open('CHANGELOG.md', encoding='utf-8').read()
          s = s.replace('## [Unreleased]',
                        f'## [Unreleased]\n\nNothing yet.\n\n## [{ver}]', 1)
          open('CHANGELOG.md', 'w', encoding='utf-8').write(s)
          PY
          fi

      - name: Commit manifest and changelog
        if: steps.check.outputs.release == 'yes'
        env:
          V: ${{ steps.check.outputs.version }}
        run: |
          if git diff --quiet -- CHANGELOG.md VERSIONS.json; then exit 0; fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md VERSIONS.json
          git commit -m "release v$V [skip ci]"
          git push origin HEAD:master

      - name: Package and publish
        if: steps.check.outputs.release == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.check.outputs.tag }}
          V: ${{ steps.check.outputs.version }}
        run: |
          ./scripts/package-skills.sh --clean

          # /tmp/why was written by the "Has anything moved?" step
          ./scripts/changelog-section.sh "$V" > /tmp/notes.md 2>/dev/null || : > /tmp/notes.md
          {
            echo
            echo "**What moved**"
            echo
            echo '```'
            cat /tmp/why
            echo '```'
            echo
            echo "Each \`.skill\` asset is one skill, importable on its own."
          } >> /tmp/notes.md

          git tag "$TAG" && git push origin "$TAG"
          gh release create "$TAG" dist/versioned/*.skill VERSIONS.json \
            --title "$TAG" --notes-file /tmp/notes.md

      - name: Manifest-only refresh
        if: steps.check.outputs.release == 'no'
        run: |
          if git diff --quiet -- VERSIONS.json; then exit 0; fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSIONS.json
          git commit -m "chore: refresh VERSIONS.json [skip ci]"
          git push origin HEAD:master
