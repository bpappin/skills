name: Release

# Fully automatic. Push to master and this decides whether a release is
# warranted, from how the skills actually moved:
#
#   any skill's major changed  -> repo major
#   any skill's minor changed  -> repo minor
#   otherwise                  -> repo patch
#   nothing moved              -> no release, no noise
#
# So a hotfix just rides through, and you never tag, never pick a number,
# never remember a command. Add lines to CHANGELOG.md [Unreleased] while
# working and they become the release notes; skip it and the release
# still happens.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refresh the manifest
        run: ./scripts/skill-versions.sh skills --publish

      - name: Has anything moved?
        id: check
        run: |
          LAST_TAG="$(git tag --list 'v*' --sort=-v:refname | head -1)"
          echo "last tag: ${LAST_TAG:-none}"

          if [[ -n "$LAST_TAG" ]]; then
            git show "$LAST_TAG:VERSIONS.json" > /tmp/old.json 2>/dev/null || : > /tmp/old.json
          else
            : > /tmp/old.json
          fi

          if NEXT="$(./scripts/next-version.sh /tmp/old.json VERSIONS.json "${LAST_TAG:-0.0.0}" 2>/tmp/why)"; then
            echo "release=yes"        >> "$GITHUB_OUTPUT"
            echo "version=$NEXT"      >> "$GITHUB_OUTPUT"
            echo "tag=v$NEXT"         >> "$GITHUB_OUTPUT"
            { echo "### Releasing v$NEXT"; echo; echo '```'; cat /tmp/why; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "release=no" >> "$GITHUB_OUTPUT"
            echo "No skill versions moved - nothing to release." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Roll the changelog
        if: steps.check.outputs.release == 'yes'
        env:
          V: ${{ steps.check.outputs.version }}
        run: |
          if ! grep -q "^## \[$V\]" CHANGELOG.md \
             && ./scripts/changelog-section.sh Unreleased >/dev/null 2>&1; then
            python3 - "$V" "$(date +%Y-%m-%d)" <<'PY'
          import sys
          ver, today = sys.argv[1:3]
          s = open('CHANGELOG.md', encoding='utf-8').read()
          s = s.replace('## [Unreleased]',
                        f'## [Unreleased]\n\nNothing yet.\n\n## [{ver}] - {today}', 1)
          open('CHANGELOG.md', 'w', encoding='utf-8').write(s)
          PY
          fi

      - name: Commit manifest and changelog
        if: steps.check.outputs.release == 'yes'
        env:
          V: ${{ steps.check.outputs.version }}
        run: |
          if git diff --quiet -- CHANGELOG.md VERSIONS.json; then exit 0; fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md VERSIONS.json
          git commit -m "release v$V [skip ci]"
          git push origin HEAD:master

      - name: Package and publish
        if: steps.check.outputs.release == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.check.outputs.tag }}
          V: ${{ steps.check.outputs.version }}
        run: |
          ./scripts/package-skills.sh --clean

          # /tmp/why was written by the "Has anything moved?" step
          ./scripts/changelog-section.sh "$V" > /tmp/notes.md 2>/dev/null || : > /tmp/notes.md
          {
            echo
            echo "**What moved**"
            echo
            echo '```'
            cat /tmp/why
            echo '```'
            echo
            echo "Each \`.skill\` asset is one skill, importable on its own."
          } >> /tmp/notes.md

          git tag "$TAG" && git push origin "$TAG"
          gh release create "$TAG" dist/versioned/*.skill VERSIONS.json \
            --title "$TAG" --notes-file /tmp/notes.md

      - name: Manifest-only refresh
        if: steps.check.outputs.release == 'no'
        run: |
          if git diff --quiet -- VERSIONS.json; then exit 0; fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSIONS.json
          git commit -m "chore: refresh VERSIONS.json [skip ci]"
          git push origin HEAD:master
